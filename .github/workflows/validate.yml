name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Crear la release de un tag ya existente (p. ej. v29.0.0); vacio = flujo normal'
        required: false
        default: ''
        type: string
      slot:
        description: 'Franja de versionado (auto = segun la hora de la pasada)'
        required: false
        default: 'auto'
        type: choice
        options: [auto, major, minor, patch]
  schedule:
    # Validacion + control de frescura cada 6 h, siempre en punto
    - cron: '0 */6 * * *'

jobs:
  validate-data:
    name: Integridad del dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar data/ + index.json
        run: node scripts/validate.mjs

  repo-docs:
    name: Documentacion y repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Documentos obligatorios
        run: |
          for f in README.md README.en.md SCHEMA.md LICENSE CHANGELOG.md CITATION.cff schema/model.schema.json; do
            test -s "$f" || { echo "falta $f"; exit 1; }
          done
          grep -q "Attribution 4.0 International" LICENSE || { echo "LICENSE no es CC-BY-4.0"; exit 1; }
          echo "docs OK"
      - name: README con las tablas Parquet y el versionado
        run: |
          grep -q "## Qué encontrarás en el Parquet" README.md || { echo "README sin la seccion del Parquet"; exit 1; }
          grep -q "## Versionado" README.md || { echo "README sin Versionado"; exit 1; }
          node -e "JSON.parse(require('fs').readFileSync('schema/model.schema.json','utf8'))" || { echo "JSON Schema invalido"; exit 1; }
          grep -q "radar-huggingface.686f6c61.dev" README.md || { echo "README sin enlace al radar"; exit 1; }
          echo "README OK"
      - name: dist/ ignorado
        run: grep -q "^dist/" .gitignore || { echo ".gitignore no cubre dist/"; exit 1; }

  freshness:
    # Red de seguridad del worker de Contabo: si deja de publicar (en sep-2026
    # estuvo 6 dias caido sin que nadie se enterara), este job falla y GitHub
    # avisa por correo. Mide index.json.updated_at, la hora del export.
    name: Dataset al dia
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ultimo export con menos de 20 h
        run: |
          MAX_H=20   # pasadas cada 8 h: tolera una perdida + margen
          AGE_H=$(node -p "Math.floor((Date.now() - Date.parse(require('./index.json').updated_at)) / 36e5)")
          echo "Ultimo export hace ${AGE_H} h"
          [ "$AGE_H" -le "$MAX_H" ] || { echo "::error::Dataset obsoleto: ${AGE_H} h sin export (max ${MAX_H} h)"; exit 1; }
      - name: Bulk de latest con menos de 20 h
        # El repo puede estar fresco con la publicacion del bulk rota (fallo
        # en build-bulk o gh release): se mide el asset, no solo el repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAX_H=20
          AT=$(gh release view latest --json assets -q '.assets[] | select(.name == "models.jsonl.gz") | .updatedAt')
          [ -n "$AT" ] || { echo "::error::latest sin models.jsonl.gz"; exit 1; }
          AGE_H=$(( ($(date +%s) - $(date -d "$AT" +%s)) / 3600 ))
          echo "Bulk de latest subido hace ${AGE_H} h"
          [ "$AGE_H" -le "$MAX_H" ] || { echo "::error::Bulk de latest obsoleto: ${AGE_H} h (max ${MAX_H} h)"; exit 1; }
      - name: Datos del radar con movimiento en 48 h
        # updated_at del manifiesto cambia en cada export aunque la BD del
        # radar este congelada (pipeline horario caido): se mira el modelo
        # actualizado mas reciente en HF
        run: |
          MAX_H=48
          AGE_H=$(node -p "const e = require('./index.json').entries; Math.floor((Date.now() - e.reduce((m, x) => Math.max(m, Date.parse(x.updated_at) || 0), 0)) / 36e5)")
          echo "Modelo mas reciente actualizado hace ${AGE_H} h"
          [ "$AGE_H" -le "$MAX_H" ] || { echo "::error::El radar parece congelado: ningun modelo actualizado en ${AGE_H} h"; exit 1; }

  release:
    name: Releases (latest + versionada)
    # Solo publican los push a main y el dispatch manual. La ejecucion
    # programada refrescaba latest con datos viejos (falsa frescura) y una
    # PR lo sobrescribiria con sus datos
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.tag == ''
    runs-on: ubuntu-latest
    needs: [validate-data, repo-docs]
    # De una en una: dos push seguidos calculaban la misma version y el
    # segundo fallaba con "a release with the same tag name already exists"
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construir models.jsonl.gz
        run: node scripts/build-bulk.mjs
      - name: Actualizar release latest (flotante)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/models.jsonl.gz --clobber
          else
            gh release create latest dist/models.jsonl.gz --title latest --notes "Bulk mas reciente del dataset"
          fi
      - name: Release numerada (push con cambios de datos, o dispatch manual)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCED_SLOT: ${{ github.event.inputs.slot }}
        run: |
          set -e
          chmod +x scripts/next-version.sh
          NEXT=$(scripts/next-version.sh "${FORCED_SLOT:-auto}")
          if [ -z "$NEXT" ]; then
            echo "No toca release"
            exit 0
          fi
          TOTAL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('index.json','utf8')).models)")
          gh release create "$NEXT" dist/models.jsonl.gz \
            --title "$NEXT" \
            --notes "Snapshot del dataset: $TOTAL modelos ($(date -u +%Y-%m-%d)). El release \`latest\` siempre apunta a la version mas reciente."
          echo "Release $NEXT creada ($TOTAL modelos)"
      - name: Tablas Parquet en latest (desde Hugging Face)
        # El worker sube las tablas a Hugging Face antes del push. Aqui se
        # descargan, se comprueba su SHA-256 contra el manifiesto y se
        # adjuntan a latest. Si son de otra pasada (o el push es solo de
        # documentacion), no se tocan las que ya hay. Va el ultimo paso: un
        # fallo aqui no impide la release numerada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BASE=https://huggingface.co/datasets/686f6c61/radar-huggingface-dataset/resolve/main
          mkdir -p dist/parquet && cd dist/parquet
          if ! curl -fsSL --retry 3 -o manifest.json "$BASE/manifest.json"; then
            echo "::warning::Sin manifest.json en Hugging Face: no se adjuntan tablas Parquet"
            exit 0
          fi
          WANT=$(node -p "JSON.parse(require('fs').readFileSync('../../index.json','utf8')).updated_at")
          GOT=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).exported_at")
          if [ "$WANT" != "$GOT" ]; then
            echo "::warning::Tablas Parquet de otra pasada ($GOT; el repo es de $WANT): no se adjuntan"
            exit 0
          fi
          node -e "for (const t of Object.values(JSON.parse(require('fs').readFileSync('manifest.json','utf8')).tables)) console.log(t.sha256 + '  ' + t.file)" > SHA256SUMS
          for f in $(cut -d' ' -f3 SHA256SUMS); do
            curl -fsSL --retry 3 -o "$f" "$BASE/$f"
          done
          sha256sum -c SHA256SUMS
          gh release upload latest *.parquet manifest.json SHA256SUMS --clobber
          echo "Tablas Parquet adjuntadas a latest ($GOT)"

  release-tag:
    # Release de un tag concreto (p. ej. franjas reconstruidas tras un hueco
    # del worker). No toca latest ni calcula version: el tag ya existe.
    name: Release de un tag existente
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar el tag
        run: node scripts/validate.mjs
      - name: Construir models.jsonl.gz
        run: node scripts/build-bulk.mjs
      - name: Crear la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          TOTAL=$(node -p "require('./index.json').models")
          DAY=$(node -p "require('./index.json').updated_at.slice(0, 10)")
          NOTES="Snapshot del dataset: $TOTAL modelos ($DAY). El release \`latest\` siempre apunta a la version mas reciente."
          if git log -1 --format=%s | grep -q reconstruido; then
            NOTES="$NOTES

          **Release reconstruida** desde la BD del radar: el worker estuvo caido del 17 al 22-sep-2026. Pertenencia estimada a partir del ultimo dataset publicado (v28.1.1) y la fecha de creacion en HF; likes, descargas y trending del snapshot diario de metricas; ficha y resto de metadatos con su valor actual. Desviacion frente a los recuentos reales del worker: menor del 0,2 %."
          fi
          NEWEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          LATEST=false; [ "$TAG" = "$NEWEST" ] && LATEST=true
          gh release create "$TAG" dist/models.jsonl.gz --verify-tag --title "$TAG" --notes "$NOTES" --latest=$LATEST
          echo "Release $TAG creada ($TOTAL modelos, latest=$LATEST)"
